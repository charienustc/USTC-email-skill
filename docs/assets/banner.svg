<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="USTC Email Skill — 中国科学技术大学邮箱技能">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="55%" stop-color="#132a45"/>
      <stop offset="100%" stop-color="#0f3d5c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4da3ff"/>
      <stop offset="100%" stop-color="#7ee0c0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <!-- envelope, drawn as line art -->
  <g transform="translate(96 84)" fill="none" stroke="url(#accent)" stroke-width="3"
     stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
    <rect x="0" y="0" width="112" height="80" rx="8"/>
    <path d="M2 8 L56 48 L110 8"/>
  </g>

  <!-- a read cursor sitting on the envelope, the read-only mark -->
  <rect x="150" y="150" width="3" height="18" fill="#7ee0c0">
    <animate attributeName="opacity" values="1;0;1" dur="1.6s" repeatCount="indefinite"/>
  </rect>

  <text x="248" y="128" font-family="Segoe UI, -apple-system, Helvetica Neue, Arial, sans-serif"
        font-size="52" font-weight="700" fill="#ffffff" letter-spacing="0.5">USTC Email Skill</text>
  <text x="250" y="172" font-family="Segoe UI, -apple-system, Helvetica Neue, Arial, sans-serif"
        font-size="24" fill="#9fc4e0">中国科学技术大学邮箱 · 只读 · 跨平台 agent 技能</text>

  <line x1="250" y1="198" x2="1090" y2="198" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>

  <text x="250" y="232" font-family="ui-monospace, SFMono-Regular, Consolas, monospace"
        font-size="17" fill="#7ee0c0">$ node bin/ustc-mail.mjs list --limit 20 --preview 200</text>
  <text x="250" y="260" font-family="ui-monospace, SFMono-Regular, Consolas, monospace"
        font-size="17" fill="#6f8ba6">INSTALL</text>
  <text x="330" y="260" font-family="ui-monospace, SFMono-Regular, Consolas, monospace"
        font-size="17" fill="#9fc4e0">EXAMINE + BODY.PEEK — 不标记已读、不删除、不发送</text>
</svg>
